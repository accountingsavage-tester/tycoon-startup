<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crystal Rite</title><style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&display=swap');*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#08051a;color:#fff;font-family:Cinzel,Georgia,serif}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{padding:14px;display:flex;justify-content:space-between;background:linear-gradient(#08051aee,transparent)}.brand{color:#f0d080;font-weight:800;letter-spacing:.18em}.pill,.panel,.legend,.modalcard{background:#100a25cc;border:1px solid #e9c46a66;box-shadow:0 15px 50px #0008;backdrop-filter:blur(12px);border-radius:12px}.pill{padding:8px 11px;font-size:11px}.panel{position:absolute;right:16px;top:74px;width:min(330px,calc(100% - 32px));padding:17px;pointer-events:auto}.panel h2{margin:0 0 6px;color:#f0d080;font-size:20px}.panel p{font:13px Georgia;color:#c7bfd5;line-height:1.55;margin:0 0 14px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:44px;border-radius:10px;border:1px solid #e9c46a66;background:#1c1238;color:#fff;font:700 11px Cinzel;cursor:pointer}.gold{background:#8d6420;border-color:#f0d080}.legend{position:absolute;left:14px;bottom:14px;padding:10px 12px;font-size:10px;color:#c7bfd5;line-height:1.7}.help{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:1px solid #e9c46a88;background:#100a25e8;color:#f0d080;font:700 18px Cinzel;pointer-events:auto}.modal{position:absolute;inset:0;background:#03020baa;display:grid;place-items:center;pointer-events:auto}.modalcard{width:min(460px,calc(100% - 30px));padding:28px;text-align:center}.modalcard h1{color:#f0d080;font-size:34px;margin:0 0 8px}.modalcard p{font:15px/1.7 Georgia;color:#c7bfd5}.hidden{display:none!important}@media(max-width:600px){.panel{top:auto;bottom:70px;left:10px;right:10px;width:auto}.legend{max-width:230px}.brand{font-size:12px}.top{padding:10px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm"}}</script></head><body><div class="hud"><div class="top"><div class="brand">✦ CRYSTAL RITE</div><div class="pill" id="status">RITE I · 0/3</div></div><div class="panel"><h2 id="title">Choose a Sigil</h2><p id="text">Tap three crystals. The gate accepts three different essences.</p><div class="buttons"><button class="btn" id="clear">CLEAR</button><button class="btn gold" id="rite">PERFORM RITE</button></div></div><div class="legend">CYAN · MOON &nbsp; PINK · ROSE &nbsp; GOLD · SUN &nbsp; GREEN · VERDANT<br>Drag to orbit · pinch/wheel to zoom · tap crystals to choose</div><button class="help" id="help">?</button></div><div class="modal hidden" id="modal"><div class="modalcard" id="modalcard"></div></div><script type="module">import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{CSS2DRenderer,CSS2DObject}from'three/addons/renderers/CSS2DRenderer.js';import*as C from'cannon-es';
const $=id=>document.getElementById(id),scene=new T.Scene(),cam=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100),ren=new T.WebGLRenderer({antialias:true}),lab=new CSS2DRenderer();ren.setPixelRatio(Math.min(devicePixelRatio,1.7));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);lab.setSize(innerWidth,innerHeight);lab.domElement.style.cssText='position:fixed;inset:0;pointer-events:none';document.body.append(lab.domElement);cam.position.set(0,14,19);const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.minDistance=10;ctl.maxDistance=28;ctl.maxPolarAngle=1.35;ctl.target.y=1;
scene.background=new T.Color(0x09051b);scene.fog=new T.FogExp2(0x09051b,.02);scene.add(new T.HemisphereLight(0x819dff,0x21102d,1.6));let key=new T.DirectionalLight(0xffd29a,3);key.position.set(8,15,6);key.castShadow=true;scene.add(key);let rim=new T.DirectionalLight(0x55ddff,2);rim.position.set(-10,9,-10);scene.add(rim);
let floor=new T.Mesh(new T.CylinderGeometry(12,12,.5,48),new T.MeshStandardMaterial({color:0x28223e,flatShading:true,roughness:1}));floor.receiveShadow=true;scene.add(floor);[5,9,11.5].forEach(r=>{let q=new T.Mesh(new T.TorusGeometry(r,.025,4,80),new T.MeshBasicMaterial({color:0x7257d9,transparent:true,opacity:.3}));q.rotation.x=Math.PI/2;q.position.y=.27;scene.add(q)});
let stars=[];for(let i=0;i<500;i++){let a=Math.random()*6.28,r=20+Math.random()*25;stars.push(Math.cos(a)*r,4+Math.random()*24,Math.sin(a)*r)}let sg=new T.BufferGeometry();sg.setAttribute('position',new T.Float32BufferAttribute(stars,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xc0b4ff,size:.08})));
let altar=new T.Group();scene.add(altar);let base=new T.Mesh(new T.CylinderGeometry(2.2,2.6,.65,8),new T.MeshStandardMaterial({color:0x403653,flatShading:true}));base.position.y=.6;base.castShadow=true;altar.add(base);let gate=new T.Mesh(new T.TorusGeometry(1.45,.16,6,16),new T.MeshStandardMaterial({color:0x7556e6,emissive:0x4025a0,emissiveIntensity:1.8,flatShading:true}));gate.rotation.y=Math.PI/2;gate.position.y=2.4;altar.add(gate);let core=new T.Mesh(new T.IcosahedronGeometry(.65,1),new T.MeshStandardMaterial({color:0xffd15c,emissive:0xff9d00,emissiveIntensity:2,flatShading:true}));core.position.y=2.4;altar.add(core);
const world=new C.World({gravity:new C.Vec3(0,-12,0)});world.addBody(new C.Body({mass:0,shape:new C.Cylinder(12,12,.5,48),position:new C.Vec3(0,-.3,0)}));const colors=[['MOON',0x54e8ff],['ROSE',0xff5fbd],['SUN',0xffd15c],['VERDANT',0x72f09b]];let crystals=[],chosen=[],round=1;
function make(c,i){let a=i/8*Math.PI*2+.2,r=6.7+(i%2)*1.8,g=new T.Group();g.position.set(Math.cos(a)*r,1.35,Math.sin(a)*r);g.userData.color=c[0];let m=new T.Mesh(new T.ConeGeometry(.65,1.8,6),new T.MeshStandardMaterial({color:c[1],emissive:c[1],emissiveIntensity:.9,flatShading:true}));m.castShadow=true;g.add(m);let p=new T.Mesh(new T.CylinderGeometry(.75,.9,.35,8),new T.MeshStandardMaterial({color:0x39304c,flatShading:true}));p.position.y=-1;g.add(p);let e=document.createElement('div');e.textContent=c[0];e.style.cssText='display:none;padding:4px 7px;border:1px solid #ffffff44;border-radius:7px;background:#08051ddd;font:700 9px Cinzel';let l=new CSS2DObject(e);l.position.y=1.25;g.add(l);g.userData.label=e;scene.add(g);crystals.push(g)}
function newRound(){crystals.forEach(x=>scene.remove(x));crystals=[];chosen=[];let pool=[...colors,...colors];for(let i=pool.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pool.forEach(make);update()}function choose(g){if(chosen.length>=3||chosen.includes(g))return;chosen.push(g);g.scale.setScalar(1.2);g.userData.label.style.display='block';g.userData.label.textContent=(chosen.indexOf(g)+1)+' · '+g.userData.color;$('status').textContent=`RITE ${round} · ${chosen.length}/3`;if(chosen.length===3){$('title').textContent='The Rite is Ready';$('text').textContent='Three sigils chosen. If their essences differ, the gate will awaken.'}}
function clear(){chosen.forEach(g=>{g.scale.setScalar(1);g.userData.label.style.display='none'});chosen=[];update()}function update(){if(!chosen.length){$('title').textContent='Choose a Sigil';$('text').textContent='Tap three crystals. The gate accepts three different essences.'}$('status').textContent=`RITE ${round} · ${chosen.length}/3`}function perform(){if(chosen.length<3){$('text').textContent='The altar needs three sigils.';return}if(new Set(chosen.map(g=>g.userData.color)).size<3){$('text').textContent='The gate rejects the rite. Choose three different essences.';chosen.forEach(g=>{g.scale.setScalar(1.1)});return}burst();setTimeout(()=>{ $('modalcard').innerHTML='<h1>RITE COMPLETE</h1><p>The three essences harmonized. The ancient gate has opened.</p><button class="btn gold" style="width:100%" id="next">ENTER NEXT RITE</button>';$('modal').classList.remove('hidden');$('next').onclick=()=>{$('modal').classList.add('hidden');round++;newRound()};},650)}
function burst(){for(let i=0;i<30;i++){let s=new T.Mesh(new T.TetrahedronGeometry(.12+Math.random()*.14),new T.MeshStandardMaterial({color:colors[i%4][1],emissive:colors[i%4][1],emissiveIntensity:.5,flatShading:true}));s.position.copy(core.getWorldPosition(new T.Vector3()));scene.add(s);let b=new C.Body({mass:.15,shape:new C.Sphere(.12),material:new C.Material({restitution:.8})});b.position.set(s.position.x,s.position.y,s.position.z);b.velocity.set((Math.random()-.5)*9,5+Math.random()*8,(Math.random()-.5)*9);world.addBody(b);s.userData.b=b;setTimeout(()=>{world.removeBody(b);scene.remove(s)},2500)}}
$('clear').onclick=clear;$('rite').onclick=perform;$('help').onclick=()=>{$('modalcard').innerHTML='<h1>THE RITE</h1><p>Sixteen enchanted crystals circle the altar. Select three crystals with different essences. The gate will only answer a true triad.</p><p>Tap to select. Drag to explore the arena. Pinch or wheel to zoom.</p><button class="btn gold" style="width:100%" id="close">RETURN</button>';$('modal').classList.remove('hidden');$('close').onclick=()=>$('modal').classList.add('hidden')};
let ray=new T.Raycaster(),mouse=new T.Vector2(),down;ren.domElement.onpointerdown=e=>down=[e.clientX,e.clientY];ren.domElement.onpointerup=e=>{if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,cam);let h=ray.intersectObjects(crystals,true);if(h.length){let g=h[0].object;while(g.parent&&!g.userData.color)g=g.parent;choose(g)}};
newRound();let clock=new T.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.033);world.step(1/60,dt,3);crystals.forEach((g,i)=>{g.position.y=1.35+Math.sin(performance.now()*.0012+i)*.08;g.rotation.y+=dt*.3});core.rotation.y+=dt*.7;core.position.y=2.4+Math.sin(performance.now()*.002)*.12;scene.traverse(o=>{if(o.userData.b){let b=o.userData.b;o.position.set(b.position.x,b.position.y,b.position.z);o.quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w)}});ctl.update();ren.render(scene,cam);lab.render(scene,cam)}loop();onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);lab.setSize(innerWidth,innerHeight)};</script></body></html>
